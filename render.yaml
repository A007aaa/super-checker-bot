services:
  - type: web
    name: super-checker-bot
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_ID
        sync: false
